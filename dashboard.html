<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern User Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS STARTS HERE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dashboard-container {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 20px;
            border: 2px solid white;
        }

        h2 {
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .welcome-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-weight: 300;
        }

        #display-username {
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 10px;
            border-radius: 5px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-main {
            background: white;
            color: #e73c7e;
        }

        .btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn-logout:hover {
            background: #ff4b2b;
            border-color: #ff4b2b;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="glass-card">
            <div class="avatar">👤</div>
            <h2>Dashboard</h2>
            
            <p class="welcome-text">
                Welcome back, <span id="display-username">User</span>!
            </p>

            <div class="btn-group">
                <button class="btn btn-main">View Profile</button>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        // JAVASCRIPT STARTS HERE
        
        // Page load hone par username set karna
        window.onload = function() {
            // LocalStorage se data check karna
            const storedName = localStorage.getItem('username');
            
            if (storedName) {
                document.getElementById('display-username').innerText = storedName;
            } else {
                // Agar login nahi hai toh 'Guest' dikhayega
                document.getElementById('display-username').innerText = "Guest";
            }
        };

        function logout() {
            // Session ya LocalStorage clear karna
            localStorage.removeItem('username');
            
            alert("Logging out safely...");
            
            // Yahan apne login page ka file name likhein (e.g., signup.html ya index.html)
            window.location.href = "signup.html"; 
        }
    </script>
</body>
</html>
